rules:
  - id: no-direct-sql-import
    patterns:
      - pattern: import sqlite3
    message: >
      Direct sqlite3 import is prohibited. All database access must go through
      the DB Gateway service. Use Gateway*Store implementations instead.
    languages: [python]
    severity: ERROR
    paths:
      include:
        - src/
      exclude:
        - tests/
        - src/db_gateway_service/

  - id: no-direct-sql-from-import
    patterns:
      - pattern-regex: "^from\\s+sqlite3\\s+import\\s+.+$"
    message: >
      Direct sqlite3 import is prohibited. All database access must go through
      the DB Gateway service. Use Gateway*Store implementations instead.
    languages: [python]
    severity: ERROR
    paths:
      include:
        - src/
      exclude:
        - tests/
        - src/db_gateway_service/

  - id: no-aiosqlite-import
    patterns:
      - pattern: import aiosqlite
    message: >
      Direct aiosqlite import is prohibited. All database access must go through
      the DB Gateway service.
    languages: [python]
    severity: ERROR
    paths:
      include:
        - src/
      exclude:
        - tests/
        - src/db_gateway_service/
        # Sanctioned observatory-pattern exception (Q-4 decision, ratified
        # 2026-07-10: docs/plans/2026-07-10-q4-ui-read-path-decision.md).
        # The UI service reads a direct, read-only ("?mode=ro") aiosqlite
        # connection to the shared economy.db for dashboard queries — the
        # cheaper, already-working option versus a new gateway read API.
        # Guarded by services/ui/tests/architecture/test_readonly_connection.py,
        # which asserts the connection URI carries mode=ro.
        - src/ui_service/

  - id: no-aiosqlite-from-import
    patterns:
      - pattern-regex: "^from\\s+aiosqlite\\s+import\\s+.+$"
    message: >
      Direct aiosqlite import is prohibited. All database access must go through
      the DB Gateway service.
    languages: [python]
    severity: ERROR
    paths:
      include:
        - src/
      exclude:
        - tests/
        - src/db_gateway_service/
        # Sanctioned observatory-pattern exception (Q-4 decision, ratified
        # 2026-07-10: docs/plans/2026-07-10-q4-ui-read-path-decision.md).
        # See the no-aiosqlite-import rule above for the full rationale.
        - src/ui_service/
