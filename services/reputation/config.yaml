# Reputation Service Configuration
# Environment variable overrides use prefix: REPUTATION__

service:
  name: "reputation"
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 8004
  log_level: "info"

logging:
  level: "INFO"
  directory: "data/logs"

platform:
  agent_config_path: "../../agents/config.yaml"

identity:
  base_url: "http://localhost:8001"
  get_agent_path: "/agents"
  verify_jws_path: "/agents/verify-jws"
  timeout_seconds: 10

task_board:
  base_url: "http://localhost:8003"
  timeout_seconds: 10

request:
  max_body_size: 1048576  # 1MB

feedback:
  reveal_timeout_seconds: 86400  # 24 hours
  max_comment_length: 256
  reveal_sweep_interval_seconds: 60  # how often timed-out sealed feedback is revealed

quality:
  operator_name: "operator"  # Identity name whose signed reads may see all quality provenance

db_gateway:
  url: "http://127.0.0.1:8007"
  timeout_seconds: 10
  signing:
    kid: "gateway-reputation"
    private_key_path: "../../data/keys/gateway-reputation.key"
    audience: "db-gateway"
    token_ttl_seconds: 300

telemetry:
  enabled: true
  otlp_endpoint: "http://127.0.0.1:4318"
  sample_ratio: 1.0
  excluded_urls: "health"
