# Court Service Configuration
# Environment variable overrides use prefix: COURT__

service:
  name: "court"
  version: "0.1.0"

server:
  host: "127.0.0.1"
  port: 8005
  log_level: "info"

logging:
  level: "INFO"
  directory: "data/logs"

platform:
  agent_config_path: "../../agents/config.yaml"

disputes:
  rebuttal_deadline_seconds: 86400
  max_claim_length: 10000
  max_rebuttal_length: 10000
  # Ruling feedback-rating cutoffs (worker_pct >= this -> the given rating)
  # and the feedback comment cap, threaded into RulingOrchestrator (WP-11).
  feedback_extremely_satisfied_cutoff: 80
  feedback_satisfied_cutoff: 40
  feedback_comment_max_length: 256
  # Judging lease held by one ruling run (must exceed the slowest judge panel),
  # and how often the reclaim sweep resumes expired or released leases.
  judging_lease_seconds: 300
  reclaim_interval_seconds: 30

judges:
  # Production panel (plan 3.2, business rule 5): three OpenAI-compatible judges,
  # median aggregation. The defaults point at a local LM Studio server; set
  # api_base/model to any OpenAI-compatible endpoint. COURT_JUDGE_API_KEY must be
  # set (services/court/.env, chmod 600); LM Studio accepts any non-empty value.
  # Dev/test/CI select the mock profile instead: panel_size 1 and one judge with
  # provider "mock" (scripts/isolated_test_runtime.py applies that override).
  panel_size: 3
  # Fixed findings returned by mock judges (dev/test/CI only).
  mock_worker_pct: 50
  mock_spec_quality: "satisfied"
  mock_delivery_quality: "satisfied"
  judges:
    - id: "judge-0"
      provider: "llm"
      model: "openai/qwen/qwen3.6-35b-a3b"
      api_base: "http://localhost:1234/v1"
      api_key_env: "COURT_JUDGE_API_KEY"
      temperature: 0.2
      timeout_seconds: 300
    - id: "judge-1"
      provider: "llm"
      model: "openai/google/gemma-4-26b-a4b"
      api_base: "http://localhost:1234/v1"
      api_key_env: "COURT_JUDGE_API_KEY"
      temperature: 0.2
      timeout_seconds: 300
    - id: "judge-2"
      provider: "llm"
      model: "openai/mistralai/ministral-3-14b-reasoning"
      api_base: "http://localhost:1234/v1"
      api_key_env: "COURT_JUDGE_API_KEY"
      temperature: 0.2
      timeout_seconds: 300

# Plan 3.1: evidence handed to judges is never truncated or leniently decoded.
# Files over max_file_bytes, files beyond max_total_bytes, unsupported formats and
# invalid UTF-8 are listed in the manifest with an explicit status and no content.
evidence:
  max_total_bytes: 262144
  max_file_bytes: 65536
  allowed_extensions: [".txt", ".md", ".py", ".js", ".ts", ".java", ".go", ".rs", ".c", ".h", ".cpp", ".sh", ".sql", ".html", ".css", ".yaml", ".yml", ".toml", ".json", ".csv"]
  allowed_content_types: ["text/plain", "text/markdown", "text/x-python", "text/csv", "application/json"]

request:
  max_body_size: 1048576

db_gateway:
  url: "http://127.0.0.1:8007"
  timeout_seconds: 10
  signing:
    kid: "gateway-court"
    private_key_path: "../../data/keys/gateway-court.key"
    audience: "db-gateway"
    token_ttl_seconds: 300

telemetry:
  enabled: true
  otlp_endpoint: "http://127.0.0.1:4318"
  sample_ratio: 1.0
  excluded_urls: "health"
