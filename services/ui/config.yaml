# UI Service Configuration
# Settings come from this file; the UI service has no environment-variable override prefix.

service:
  name: "ui"
  version: "0.1.0"

# SECURITY POSTURE (Q-3 decision:
# docs/plans/2026-07-10-q3-proxy-exposure-decision.md): server.host below
# remains loopback-only. MP-02 additionally requires an allowed Host, a
# loopback client and an exact same-origin Origin plus custom marker for
# writes. The marker is not a secret or user authentication. These routes
# spend the operator's funds (Q-2); no public authenticated deployment mode
# exists, so non-loopback binding is rejected and forwarding is unsupported.
server:
  host: "127.0.0.1"
  port: 8008
  log_level: "info"

logging:
  level: "INFO"
  directory: "data/logs"

database:
  path: "../db-gateway/data/economy.db"

sse:
  poll_interval_seconds: 1
  keepalive_interval_seconds: 15
  batch_size: 50

frontend:
  web_root: "data/web"

request:
  max_body_size: 1572864

recovery:
  maintenance_lock_path: "../../data/maintenance.lock"

browser_security:
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
    - "[::1]"
  allowed_origins:
    - "http://127.0.0.1:8008"
    - "http://localhost:8008"
    - "http://[::1]:8008"
  # Non-secret marker: cross-origin HTML forms cannot set this header. It is
  # browser CSRF defense for the local operator workflow, not authentication.
  csrf_header_name: "X-ATE-CSRF"
  csrf_header_value: "local-operator"
  content_security_policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

user_agent:
  agent_config_path: "../../agents/config.yaml"
  # Roster handle the UI's UserAgent signs proxy actions as (Q-2 decision:
  # docs/plans/2026-07-10-q2-operator-identity-decision.md). A distinct
  # economic identity from "platform" — the platform key is reserved for
  # notary operations (contract co-signing, platform-signed service calls);
  # every /api/proxy/* action is attributed to this operator identity.
  #
  # Genesis funding for this account is NOT the UI's concern (Q-9 decision:
  # docs/plans/2026-07-10-q9-treasury-bootstrap-decision.md, frozen-test
  # exception #10). UI startup never mints; a zero-balance operator at
  # startup is normal. Run `just provision` once (idempotent,
  # agents/src/treasury_provision_cli) to fund the operator's account.
  handle: "operator"
