[project]
name = "agent-economy-tools"
version = "0.1.0"
description = "Simulation tools and CLI utilities for the agent economy"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "openai>=1.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "cryptography>=48.0.1",
    "service-auth",
    "service-commons",
]

[tool.uv.sources]
service-auth = { path = "../libs/service-auth", editable = true }
service-commons = { path = "../libs/service-commons", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
    "bandit>=1.7.0",
    "codespell>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_task_factory", "src/demo_replay"]

# === Ruff ===
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B101: assert statements (matches every service's skip list).
# B311: math_task_factory uses random.Random for reproducible, seeded task
# generation — non-cryptographic by design, not a security-sensitive use.
skips = ["B101", "B311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Fast isolated unit tests",
    "integration: Require running service",
    "performance: Latency/throughput benchmarks",
]
