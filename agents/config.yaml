# Base Agent Configuration
# Settings come from this file; the agents runtime has no environment-variable override prefix.

platform:
  identity_url: "http://localhost:8001"
  bank_url: "http://localhost:8002"
  task_board_url: "http://localhost:8003"
  reputation_url: "http://localhost:8004"
  court_url: "http://localhost:8005"

data:
  keys_dir: "../data/keys"
  roster_path: "roster.yaml"

# Caller-owned journals; every setting is explicit and validated before startup.
runtime_state:
  environment_id: "local-agent-economy"
  directory: "../data/agent-runtime"
  diagnostic_limit: 8
  max_record_bytes: 65536

# JWS token signing (WP-02 / Q-10)
signing:
  # Lifetime stamped into each signed token's iat/exp header claims (seconds).
  token_ttl_seconds: 300
  max_lifetime_seconds: 300
  clock_skew_seconds: 30

# Treasury provisioning (WP-08 / Q-9). Idempotent genesis for the UI
# operator's account, run explicitly via `just provision` — see
# docs/plans/2026-07-10-q9-treasury-bootstrap-decision.md.
treasury:
  handle: "operator"
  genesis_amount: 1000000
  genesis_reference: "treasury_genesis"

# Task Feeder settings
task_feeder:
  handle: "feeder"
  tasks_file: "../data/math_tasks.jsonl"
  source_max_bytes: 8388608
  feed_interval_seconds: 15
  max_open_tasks: 5
  bidding_deadline_seconds: 120
  # Poster-selected duration after bidding closes; distinct from selection delay below.
  acceptance_window_seconds: 120
  execution_deadline_seconds: 300
  review_deadline_seconds: 120
  review_interval_seconds: 30
  # Wait before retrying a loop pass after a dependency (Task Board etc.) error.
  retry_backoff_seconds: 5
  auto_approve_on_error: false
  base_reward: 10
  reward_per_level: 10
  shuffle: true
  # Autonomous bid acceptance (WP-15 / Q-16). acceptance_after_seconds MUST be
  # strictly less than bidding_deadline_seconds (T-035) or tasks expire before
  # they can be accepted.
  acceptance_after_seconds: 30
  acceptance_poll_interval_seconds: 5
  min_bids_to_accept: 2

# Named worker profiles — used by WorkerFactory
workers:
  mathbot:
    handle: "mathbot"
    type: "math_worker"
    llm:
      base_url: "http://127.0.0.1:1234/v1"
      api_key: "${LMSTUDIO_API_KEY}"
      model_id: "gemma-3-1b-it"
      temperature: 0.7
      max_tokens: 2048
    behavior:
      scan_interval_seconds: 10
      poll_interval_seconds: 3
      max_poll_attempts: 100
      error_backoff_seconds: 5
      min_reward: 50
      max_reward: 10000

  mathbot_openai:
    handle: "mathbot_openai"
    type: "math_worker"
    llm:
      base_url: "https://api.openai.com/v1"
      api_key: "${OPENAI_API_KEY}"
      model_id: "o4-mini"
      temperature: 0.5
      max_tokens: 4096
    behavior:
      scan_interval_seconds: 10
      poll_interval_seconds: 3
      max_poll_attempts: 100
      error_backoff_seconds: 5
      min_reward: 50
      max_reward: 10000

  mathbot_mistral:
    handle: "mathbot_mistral"
    type: "math_worker"
    llm:
      base_url: "https://api.mistral.ai/v1"
      api_key: "${MISTRAL_API_KEY}"
      model_id: "mistral-small-latest"
      temperature: 0.7
      max_tokens: 4096
    behavior:
      scan_interval_seconds: 10
      poll_interval_seconds: 3
      max_poll_attempts: 100
      error_backoff_seconds: 5
      min_reward: 50
      max_reward: 10000

# Text-classification workers (G18). To feed classification tasks instead of
# math, render the tracked seed once and point task_feeder.tasks_file at it:
#   uv run python -m task_feeder.workloads \
#     src/task_feeder/workloads/classification_seed.json ../data/classification_tasks.jsonl
# Pricing is integer percent of the task reward and adapts per task type from
# the outcomes each worker records in its durable job journal.
classification_workers:
  classbot_llm:
    handle: "classbot_llm"
    strategy: "llm"
    llm:
      base_url: "http://127.0.0.1:1234/v1"
      api_key: "${LMSTUDIO_API_KEY}"
      model_id: "gemma-3-1b-it"
      temperature: 0.2
      max_tokens: 1024
    keywords: null
    behavior:
      scan_interval_seconds: 10
      poll_interval_seconds: 3
      max_poll_attempts: 100
      error_backoff_seconds: 5
      min_reward: 1
      max_reward: 10000
    pricing:
      initial_bid_pct: 90
      min_bid_pct: 60
      max_bid_pct: 100
      raise_step_pct: 5
      lower_step_pct: 10
      min_samples: 4
      min_approval_pct: 50

  classbot_keyword:
    handle: "classbot_keyword"
    strategy: "keyword"
    llm: null
    keywords:
      positive: ["love", "great", "excellent", "happy", "solid", "reliable", "would buy"]
      negative: ["terrible", "broke", "awful", "worst", "poor", "bad", "disappointed", "regret", "refund"]
      neutral: ["arrived", "contains", "ships with", "pages", "box"]
      billing: ["charged", "invoice", "refund", "payment", "billed", "money back"]
      bug: ["crash", "does nothing", "freeze", "error"]
      feature_request: ["could you add", "would be great", "would save"]
      account: ["password", "login", "sign in", "profile"]
    behavior:
      scan_interval_seconds: 10
      poll_interval_seconds: 3
      max_poll_attempts: 100
      error_backoff_seconds: 5
      min_reward: 1
      max_reward: 10000
    pricing:
      initial_bid_pct: 70
      min_bid_pct: 40
      max_bid_pct: 95
      raise_step_pct: 5
      lower_step_pct: 10
      min_samples: 3
      min_approval_pct: 50

# Measured economy report (G18): reads worker job journals and Reputation quality.
economy_report:
  worker_roles: ["classification-worker"]
  # Normal-approximation z for the Wilson score interval (1.96 = 95%).
  confidence_z: 1.96
  quality_timeout_seconds: 5
